name: Build W Menu

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-android64:
    name: Build Android64 .geode package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build mod with Geode SDK specified in mod.json
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given

      - name: Upload compiled Geode package
        uses: actions/upload-artifact@v4
        with:
          name: WMenu-Android64-geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
